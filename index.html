<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Bernulli yechim (Modern)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #eef2f7, #cfe2f3);
    text-align: center;
    margin: 0;
    padding: 0;
}

.box {
    background: linear-gradient(145deg, #ffffff, #f1f5f9);
    padding: 40px;
    margin: 50px auto;
    width: 550px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
    color: #333;
}

input {
    padding: 12px;
    margin: 10px 0;
    width: 90%;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
    transition: all 0.3s;
}

input:focus {
    border-color: #28a745;
    box-shadow: 0 0 8px rgba(40, 167, 69, 0.5);
    outline: none;
}

button {
    padding: 14px 25px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.3s, transform 0.2s;
}

button:hover {
    background: #218838;
    transform: scale(1.05);
}

table {
    margin: 20px auto;
    border-collapse: collapse;
    width: 95%;
    font-size: 15px;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th {
    background: #28a745;
    color: white;
}

tr:nth-child(even) td {
    background: #f1f5f9;
}

tr:hover td {
    background: #d4edda;
}

.result-title {
    font-weight: bold;
    margin-top: 20px;
    color: #007bff;
}

canvas {
    margin-top: 25px;
    background: #f9f9f9;
    border-radius: 15px;
    padding: 15px;
}
</style>
</head>
<body>

<div class="box">
    <h2>Bernulli formulasi (Modern)</h2>

    <input type="number" id="n" placeholder="n (tajriba soni)" min="0">
    <input type="number" id="p" placeholder="p (0.1 kabi)" step="0.01" min="0" max="1">
    <br>
    <button onclick="hisobla()">Hisoblash</button>

    <div id="steps"></div>
    <div id="tableDiv"></div>
    <canvas id="chart" width="500" height="300"></canvas>
</div>

<script>
function factorial(n) {
    if(n === 0) return 1;
    let res = 1;
    for (let i = 1; i <= n; i++) res *= i;
    return res;
}

function combination(n, k) {
    return factorial(n) / (factorial(k) * factorial(n - k));
}

function hisobla() {
    let n = Number(document.getElementById("n").value);
    let p = Number(document.getElementById("p").value);

    if(isNaN(n) || isNaN(p) || n<0 || p<0 || p>1) {
        alert("Iltimos, to‘g‘ri qiymat kiriting!");
        return;
    }

    // Natijalarni hisoblash
    let q = 1 - p;
    let results = [];
    let labels = [];
    for(let k=0; k<=n; k++) {
        let C = combination(n,k);
        let prob = C * Math.pow(p,k) * Math.pow(q, n-k);
        results.push(prob.toFixed(4));
        labels.push(k);
    }

    // Jadval yaratish
    let tableHTML = `<table>
        <tr><th>k</th><th>P(${n}, k)</th></tr>`;
    for(let i=0;i<=n;i++){
        tableHTML += `<tr><td>${labels[i]}</td><td>${results[i]}</td></tr>`;
    }
    tableHTML += `</table>`;
    document.getElementById("tableDiv").innerHTML = tableHTML;
    document.getElementById("steps").innerHTML = `<div class="result-title">Bernulli ehtimollari jadvali tayyor!</div>`;

    // Chart yaratish
    const ctx = document.getElementById('chart').getContext('2d');
    if(window.myChart) window.myChart.destroy();
    window.myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'P(n,k)',
                data: results,
                backgroundColor: 'rgba(40, 167, 69, 0.7)',
                borderColor: 'rgba(40, 167, 69, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
}
</script>

</body>
</html>
