<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maktab Buxgalteriya Cloud PRO</title>

    <meta property="og:title" content="Maktab Buxgalteriya Cloud PRO">
    <meta property="og:description" content="Talabalar hisob-kitobi va davomatini boshqarish tizimi">
    <meta property="og:image" content="https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&q=80&w=1000">
    <meta property="og:url" content="https://maktab-hisob.vercel.app">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2653/2653500.png" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ZAXIRA: Firebase ishlamasa ham sayt ochiladi va kirish ishlaydi -->
    <script>
        window.archiveData = window.archiveData || {};
        window.config = window.config || { user:'admin', pass:'123', phone:'+998',
                                           tgToken:'', chatId:'', defaultPrice:0 };
        window.cloudStatus = 'yuklanmoqda';
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDWL--54HpVLoyjsT_QOZcFoSNsawjQfHg",
            authDomain: "maktab-buxgalteriya.firebaseapp.com",
            databaseURL: "https://maktab-buxgalteriya-default-rtdb.firebaseio.com",
            projectId: "maktab-buxgalteriya",
            storageBucket: "maktab-buxgalteriya.firebasestorage.app",
            messagingSenderId: "1005121978052",
            appId: "1:1005121978052:web:5ab340f9d8c40705dbd391"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'accounting/data'), (snapshot) => {
            window.archiveData = snapshot.val() || {};
            window.cloudStatus = 'ulandi';
            if (typeof updateSyncIndicator === 'function') updateSyncIndicator();
            if (sessionStorage.getItem('isAuth') === 'true') renderTable();
        });

        // Bulutdagi config faqat to'liq bo'lsa o'zgartiriladi (bo'sh bo'lsa standart qoladi)
        onValue(ref(db, 'accounting/config'), (snapshot) => {
            const v = snapshot.val();
            if (v && v.user && v.pass) window.config = v;
        });

        window.saveToCloud = () => {
            window.cloudStatus = 'saqlanmoqda';
            if (typeof updateSyncIndicator === 'function') updateSyncIndicator();
            set(ref(db, 'accounting/data'), window.archiveData)
                .then(() => { window.cloudStatus = 'saqlandi'; if (typeof updateSyncIndicator === 'function') updateSyncIndicator(); })
                .catch(() => { window.cloudStatus = 'xato'; if (typeof updateSyncIndicator === 'function') updateSyncIndicator(); });
        };
        window.saveConfigToCloud = () => set(ref(db, 'accounting/config'), window.config);
    </script>

    <style>
        :root { --bg:#f8fafc; --card:#ffffff; --primary:#6366f1; --text:#1e293b; --sub:#64748b;
                --border:#e2e8f0; --success:#10b981; --danger:#ef4444; --warn:#f59e0b; }
        .dark-mode { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155; }
        * { box-sizing: border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text);
               margin:0; padding:20px; transition:.3s; }

        #login-overlay, .modal-overlay { position:fixed; inset:0; background:var(--bg);
               display:flex; justify-content:center; align-items:center; z-index:9999; transition:.3s; }
        .modal-overlay { background:rgba(0,0,0,.5); display:none; }
        .card { background:var(--card); padding:30px; border-radius:24px;
               box-shadow:0 10px 25px rgba(0,0,0,.08); width:100%; max-width:380px; border:1px solid var(--border); }

        input, select { background:var(--bg); color:var(--text); border:1px solid var(--border);
               border-radius:12px; padding:12px; width:100%; margin-bottom:12px; outline:none; font-family:inherit; }
        input:focus, select:focus { border-color:var(--primary); }

        .btn { padding:10px 16px; border-radius:12px; border:none; font-weight:600; cursor:pointer;
               transition:.2s; display:inline-flex; align-items:center; gap:6px; font-size:13px;
               font-family:inherit; white-space:nowrap; }
        .btn:hover { transform:translateY(-2px); }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-outline { background:var(--card); border:1px solid var(--border); color:var(--text); }
        .btn-danger { background:var(--danger); color:#fff; }

        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
               gap:14px; margin-bottom:20px; }
        .stat-card { background:var(--card); padding:16px 20px; border-radius:18px;
               border:1px solid var(--border); transition:.2s; }
        .stat-card:hover { box-shadow:0 6px 18px rgba(0,0,0,.08); transform:translateY(-2px); }
        .stat-card span { font-size:12px; color:var(--sub); font-weight:600; }
        .stat-card h2 { margin:6px 0 0; font-size:24px; }

        .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
        @media(max-width:800px){ .charts-grid{ grid-template-columns:1fr; } }
        .chart-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px; }
        .chart-card h3 { margin:0 0 12px; font-size:15px; color:var(--sub); }
        .chart-box { height:250px; position:relative; }

        .toolbar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
        .table-container { background:var(--card); border-radius:20px; padding:20px;
               overflow-x:auto; border:1px solid var(--border); }
        table { width:100%; border-collapse:separate; border-spacing:0 8px; min-width:900px; }
        th { text-align:left; padding:10px; font-size:11px; color:var(--sub); text-transform:uppercase;
               cursor:pointer; user-select:none; }
        th:hover { color:var(--primary); }
        td { padding:6px 10px; vertical-align:middle; }
        tr.row-debt td { background:rgba(239,68,68,.06); }
        tfoot td { font-weight:800; border-top:2px solid var(--border); font-size:15px; }

        .status-badge { padding:8px 12px; border-radius:10px; font-size:11px; font-weight:700;
               border:none; cursor:pointer; width:100px; font-family:inherit; }
        .st-paid { background:#d1fae5; color:#065f46; }
        .st-partial { background:#fef3c7; color:#92400e; }
        .st-debt { background:#fee2e2; color:#991b1b; }

        .attendance-btn { width:35px; height:35px; border-radius:10px; border:1px solid var(--border);
               cursor:pointer; font-size:16px; }
        .present { background:var(--success); color:#fff; }
        .absent { background:var(--danger); color:#fff; }

        .icon-btn { background:none; border:none; cursor:pointer; font-size:16px; padding:4px 6px; }
        #sync-status { font-size:12px; color:var(--sub); font-weight:600; }

        .toast { position:fixed; bottom:25px; right:25px; padding:14px 22px; border-radius:14px;
               color:#fff; font-weight:600; font-size:14px; z-index:10000; animation:pop .3s;
               box-shadow:0 8px 20px rgba(0,0,0,.2); }
        .toast.ok { background:var(--success); }
        .toast.err { background:var(--danger); }
        @keyframes pop { from { transform:translateY(20px); opacity:0; } }
    </style>
</head>
<body>

    <!-- ========== KIRISH ========== -->
    <div id="login-overlay">
        <div class="card" style="text-align:center;">
            <div style="font-size:48px;">☁️</div>
            <h2 style="margin:8px 0 20px;">Cloud Buxgalteriya PRO</h2>
            <input type="text" id="username" placeholder="Login">
            <input type="password" id="password" placeholder="Parol">
            <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleLogin()">Kirish</button>
            <button class="btn" style="background:none; color:var(--primary); font-size:12px; margin-top:10px;"
                    onclick="toggleRecover(true)">Parolni unutdim</button>
            <div id="recover-form" style="display:none; margin-top:15px; border-top:1px solid var(--border); padding-top:15px;">
                <input type="text" id="rec-phone" placeholder="Telefon: +998...">
                <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleRecover()">Parolni ko'rish</button>
                <button class="btn" style="background:none; color:var(--sub); font-size:12px; margin-top:6px;"
                        onclick="toggleRecover(false)">Bekor qilish</button>
            </div>
        </div>
    </div>

    <!-- ========== ASOSIY QISM ========== -->
    <div id="main-content" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:10px;">
            <h1 style="margin:0;">Maktab Pro ☁️</h1>
            <span id="sync-status">☁️ Ulanmoqda...</span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="addStudent()">+ Talaba</button>
                <button class="btn btn-outline" onclick="toggleDark()" id="dark-toggle">🌙</button>
                <button class="btn btn-outline" onclick="openSettings()">⚙️</button>
                <button class="btn btn-outline" onclick="logout()">Chiqish</button>
            </div>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
            <button class="btn btn-outline" onclick="exportExcel()">📊 Excel</button>
            <button class="btn btn-outline" onclick="exportPDF()">📄 PDF</button>
            <button class="btn btn-outline" onclick="copyPrevMonth()">📋 O'tgan oydan ko'chirish</button>
            <button class="btn btn-outline" onclick="sendTelegram()">🤖 Telegramga yuborish</button>
            <button class="btn btn-outline" onclick="backupJSON()">💾 Zaxira</button>
            <button class="btn btn-outline" onclick="document.getElementById('restore-file').click()">⬆️ Tiklash</button>
            <input type="file" id="restore-file" accept=".json" style="display:none" onchange="restoreJSON(this)">
        </div>

        <div class="charts-grid">
            <div class="chart-card"><h3>💰 Moliya</h3><div class="chart-box"><canvas id="barChart"></canvas></div></div>
            <div class="chart-card"><h3>📈 To'lov holati</h3><div class="chart-box"><canvas id="donutChart"></canvas></div></div>
        </div>

        <div class="toolbar">
            <select id="month-select" onchange="renderTable()" style="width:150px; margin:0;">
                <option>Yanvar</option><option>Fevral</option><option>Mart</option><option>Aprel</option>
                <option>May</option><option>Iyun</option><option>Iyul</option><option>Avgust</option>
                <option>Sentabr</option><option>Oktabr</option><option>Noyabr</option><option>Dekabr</option>
            </select>
            <input type="text" id="search-input" placeholder="🔍 Qidirish..." oninput="renderTable()"
                   style="flex:1; margin:0;">
            <button class="btn btn-outline" onclick="markAll(true)">✅ Hammasi keldi</button>
            <button class="btn btn-danger" onclick="clearMonth()">🗑 Oyni tozalash</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><span>💰 Tushum</span><h2 id="s-total" style="color:var(--primary)">0</h2></div>
            <div class="stat-card"><span>🍽 Chiqim</span><h2 id="s-food" style="color:var(--danger)">0</h2></div>
            <div class="stat-card"><span>✅ Foyda</span><h2 id="s-net" style="color:var(--success)">0</h2></div>
            <div class="stat-card"><span>👥 O'quvchilar</span><h2 id="s-count">0</h2></div>
            <div class="stat-card"><span>📅 Davomat</span><h2 id="s-att">0%</h2></div>
            <div class="stat-card"><span>🔴 Qarz</span><h2 id="s-debt" style="color:var(--danger)">0</h2></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px">Tr</th>
                        <th style="width:60px">Dars</th>
                        <th onclick="setSort('name')">Ism Sharif <span id="arr-name"></span></th>
                        <th style="width:130px" onclick="setSort('price')">Narx <span id="arr-price"></span></th>
                        <th style="width:130px">Ovqat</th>
                        <th onclick="setSort('net')">Sof <span id="arr-net"></span></th>
                        <th>Holat</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="3">JAMI</td>
                        <td id="ft-price"></td><td id="ft-food"></td><td id="ft-net"></td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- ========== SOZLAMALAR ========== -->
    <div id="modal-settings" class="modal-overlay">
        <div class="card">
            <h3 style="margin-top:0;">⚙️ Sozlamalar</h3>
            <input type="text" id="set-user" placeholder="Login">
            <input type="text" id="set-pass" placeholder="Parol">
            <input type="text" id="set-phone" placeholder="Telefon (parol tiklash uchun)">
            <input type="number" id="set-price" placeholder="Standart oylik narx">
            <input type="text" id="set-tg-token" placeholder="Telegram Bot Token">
            <input type="text" id="set-chat-id" placeholder="Telegram Chat ID">
            <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="saveSettings()">Saqlash</button>
                <button class="btn btn-outline" onclick="closeSettings()">Yopish</button>
            </div>
        </div>
    </div>

    <script>
        let myChart, donutChart;
        let sortKey = null, sortDir = 1;
        const MONTHS = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust',
                        'Sentabr','Oktabr','Noyabr','Dekabr'];
        const esc = s => String(s ?? '').replace(/"/g,'&quot;').replace(/</g,'&lt;');

        /* ---------- BILDIRISHNOMALAR ---------- */
        function toast(msg, type='ok') {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function updateSyncIndicator() {
            const el = document.getElementById('sync-status');
            if (!el) return;
            const map = { yuklanmoqda:'☁️ Ulanmoqda...', ulandi:'☁️ Bulutga ulangan',
                          saqlanmoqda:'⏳ Saqlanmoqda...', saqlandi:'✅ Saqlandi', xato:'⚠️ Ulanish xatosi' };
            el.innerText = map[window.cloudStatus] || '';
        }

        /* ---------- KIRISH (TUZATILGAN — Firebase ishlamasa ham ishlaydi) ---------- */
        function handleLogin() {
            try {
                const cfg = window.config || { user: 'admin', pass: '123' };
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value;
                if (u === cfg.user && p === cfg.pass) {
                    sessionStorage.setItem('isAuth', 'true');
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    updateSyncIndicator();
                    renderTable();
                    toast("Xush kelibsiz! 👋");
                } else {
                    alert("Login yoki parol xato!\n\nAgar parolni o'zgartirgan bo'lsangiz — shuni kiriting.\nStandart: admin / 123");
                }
            } catch (e) {
                alert("Texnik xatolik: " + e.message);
            }
        }

        function toggleRecover(show) {
            document.getElementById('recover-form').style.display = show ? 'block' : 'none';
        }

        function handleRecover() {
            const phone = document.getElementById('rec-phone').value.trim();
            if (phone && phone === window.config.phone) {
                alert("Login: " + window.config.user + "\nParol: " + window.config.pass);
            } else {
                alert("Bu telefon raqam ro'yxatda yo'q!\nSozlamalarda kiritilgan raqam: " + (window.config.phone || 'kiritilmagan'));
            }
        }

        function logout() { sessionStorage.clear(); location.reload(); }

        /* ---------- JADVAL ---------- */
        function renderTable() {
            const m = document.getElementById('month-select').value;
            const search = document.getElementById('search-input').value.toLowerCase();
            const tbody = document.getElementById('table-body');
            const data = window.archiveData[m] || [];
            let tP = 0, tF = 0, tDebt = 0, attCount = 0;
            const counts = { paid:0, partial:0, debt:0 };

            data.forEach(s => {
                tP += +s.price || 0; tF += +s.food || 0;
                if (s.att) attCount++;
                if (s.st === 'st-paid') counts.paid++;
                else if (s.st === 'st-partial') counts.partial++;
                else { counts.debt++; tDebt += (+s.price||0) - (+s.food||0); }
            });
            const tN = tP - tF;

            let rows = data.map((s, i) => ({ ...s, _i: i }));
            if (search) rows = rows.filter(s => String(s.name).toLowerCase().includes(search));
            if (sortKey) {
                rows.sort((a, b) => {
                    const x = sortKey === 'net' ? (a.price - a.food) : a[sortKey];
                    const y = sortKey === 'net' ? (b.price - b.food) : b[sortKey];
                    if (sortKey === 'name') return sortDir * String(x).localeCompare(String(y), 'uz');
                    return sortDir * ((+x || 0) - (+y || 0));
                });
            }

            tbody.innerHTML = rows.map(s => {
                const net = (+s.price || 0) - (+s.food || 0);
                return `<tr class="${s.st === 'st-debt' ? 'row-debt' : ''}">
                    <td>${s._i + 1}</td>
                    <td><button class="attendance-btn ${s.att ? 'present' : 'absent'}"
                        onclick="toggleAtt(${s._i})">${s.att ? '✅' : '❌'}</button></td>
                    <td><input class="name-input" value="${esc(s.name)}"
                        onchange="update(${s._i}, 'name', this.value)" style="border:none; background:none; margin:0;"></td>
                    <td><input type="number" value="${s.price}"
                        onchange="update(${s._i}, 'price', this.value)" style="border:none; width:100px; margin:0;"></td>
                    <td><input type="number" value="${s.food}"
                        onchange="update(${s._i}, 'food', this.value)" style="border:none; width:100px; margin:0;"></td>
                    <td><b>${net.toLocaleString()}</b></td>
                    <td><button class="status-badge ${s.st}" onclick="nextStatus(${s._i})">${getStatusLabel(s.st)}</button></td>
                    <td style="white-space:nowrap;">
                        <button class="icon-btn" title="Nusxalash" onclick="duplicate(${s._i})">📋</button>
                        <button class="icon-btn" title="O'chirish" onclick="delStudent(${s._i})">🗑</button>
                    </td>
                </tr>`;
            }).join('') || `<tr><td colspan="8" style="text-align:center; color:var(--sub); padding:30px;">
                Ma'lumot yo'q — "+ Talaba" tugmasini bosing</td></tr>`;

            document.getElementById('s-total').innerText = tP.toLocaleString();
            document.getElementById('s-food').innerText = tF.toLocaleString();
            document.getElementById('s-net').innerText = tN.toLocaleString();
            document.getElementById('s-count').innerText = data.length;
            document.getElementById('s-att').innerText =
                (data.length ? Math.round(attCount / data.length * 100) : 0) + '%';
            document.getElementById('s-debt').innerText = tDebt.toLocaleString();

            document.getElementById('ft-price').innerText = tP.toLocaleString();
            document.getElementById('ft-food').innerText = tF.toLocaleString();
            document.getElementById('ft-net').innerText = tN.toLocaleString();

            ['name','price','net'].forEach(k => {
                document.getElementById('arr-' + k).innerText = (sortKey === k) ? (sortDir > 0 ? '▲' : '▼') : '';
            });

            updateCharts(tP, tF, counts);
            updateSyncIndicator();
        }

        function setSort(k) {
            if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
            renderTable();
        }

        /* ---------- GRAFIKLAR ---------- */
        function updateCharts(tP, tF, counts) {
            const dark = document.body.classList.contains('dark-mode');
            const textC = dark ? '#94a3b8' : '#64748b';
            const gridC = dark ? '#334155' : '#e2e8f0';

            if (myChart) myChart.destroy();
            myChart = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: { labels: ['Tushum', 'Chiqim', 'Foyda'],
                    datasets: [{ data: [tP, tF, tP - tF],
                        backgroundColor: ['#6366f1', '#ef4444', '#10b981'], borderRadius: 10 }] },
                options: { maintainAspectRatio:false,
                    plugins: { legend: { display:false },
                        tooltip: { callbacks: { label: c => c.raw.toLocaleString() + " so'm" } } },
                    scales: { y: { ticks: { color:textC }, grid: { color:gridC } },
                              x: { ticks: { color:textC }, grid: { display:false } } } }
            });

            if (donutChart) donutChart.destroy();
            donutChart = new Chart(document.getElementById('donutChart'), {
                type: 'doughnut',
                data: { labels: ["To'landi ✅", "Qisman 🟡", "Qarz 🔴"],
                    datasets: [{ data: [counts.paid, counts.partial, counts.debt],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], borderWidth: 0 }] },
                options: { maintainAspectRatio:false, cutout:'62%',
                    plugins: { legend: { position:'bottom', labels:{ color:textC, usePointStyle:true } } } }
            });
        }

        /* ---------- AMALLAR ---------- */
        function toggleAtt(i) {
            const m = document.getElementById('month-select').value;
            const s = window.archiveData[m][i];
            s.att = !s.att;
            if (!s.att) s.food = 0;
            window.saveToCloud(); renderTable();
        }

        function nextStatus(i) {
            const m = document.getElementById('month-select').value;
            const modes = ['st-debt', 'st-partial', 'st-paid'];
            const s = window.archiveData[m][i];
            s.st = modes[(modes.indexOf(s.st) + 1) % 3];
            window.saveToCloud(); renderTable();
        }

        function addStudent() {
            const m = document.getElementById('month-select').value;
            if (!window.archiveData[m]) window.archiveData[m] = [];
            const dp = parseFloat(window.config.defaultPrice) || 0;
            window.archiveData[m].push({ name:'', price:dp, food:0, st:'st-debt', att:true });
            window.saveToCloud(); renderTable();
            const names = document.querySelectorAll('.name-input');
            if (names.length) names[names.length - 1].focus();
        }

        function duplicate(i) {
            const m = document.getElementById('month-select').value;
            const copy = { ...window.archiveData[m][i], name: window.archiveData[m][i].name + ' (nusxa)' };
            window.archiveData[m].splice(i + 1, 0, copy);
            window.saveToCloud(); renderTable(); toast("Nusxa yaratildi 📋");
        }

        function delStudent(i) {
            if (!confirm("O'chirilsinmi?")) return;
            const m = document.getElementById('month-select').value;
            window.archiveData[m].splice(i, 1);
            window.saveToCloud(); renderTable();
        }

        function update(i, f, v) {
            const m = document.getElementById('month-select').value;
            window.archiveData[m][i][f] = (f === 'name') ? v : parseFloat(v) || 0;
            window.saveToCloud(); renderTable();
        }

        function getStatusLabel(st) {
            return st === 'st-paid' ? "TO'LANDI" : st === 'st-partial' ? 'QISMAN' : 'QARZ';
        }

        function markAll(att) {
            const m = document.getElementById('month-select').value;
            (window.archiveData[m] || []).forEach(s => { s.att = att; if (!att) s.food = 0; });
            window.saveToCloud(); renderTable(); toast("Davomat belgilandi ✅");
        }

        function clearMonth() {
            const m = document.getElementById('month-select').value;
            if (!confirm(m + " oyidagi BARCHA ma'lumotlar o'chirilsinmi?! Buni qaytarib bo'lmaydi!")) return;
            window.archiveData[m] = [];
            window.saveToCloud(); renderTable();
        }

        function copyPrevMonth() {
            const m = document.getElementById('month-select').value;
            const idx = MONTHS.indexOf(m);
            if (idx <= 0) return toast("Yanvardan oldingi oy yo'q!", 'err');
            const prev = window.archiveData[MONTHS[idx - 1]] || [];
            if (!prev.length) return toast("O'tgan oyda ma'lumot yo'q!", 'err');
            if (!confirm(MONTHS[idx-1] + " dagi " + prev.length + " ta o'quvchi " + m + " ga ko'chirilsinmi?")) return;
            window.archiveData[m] = prev.map(s => ({ ...s, st:'st-debt', att:true }));
            window.saveToCloud(); renderTable(); toast("O'quvchilar ko'chirildi ✅");
        }

        /* ---------- SOZLAMALAR ---------- */
        function openSettings() {
            const c = window.config;
            document.getElementById('set-user').value = c.user;
            document.getElementById('set-pass').value = c.pass;
            document.getElementById('set-phone').value = c.phone || '';
            document.getElementById('set-price').value = c.defaultPrice || '';
            document.getElementById('set-tg-token').value = c.tgToken || '';
            document.getElementById('set-chat-id').value = c.chatId || '';
            document.getElementById('modal-settings').style.display = 'flex';
        }
        function closeSettings() { document.getElementById('modal-settings').style.display = 'none'; }
        function saveSettings() {
            window.config = {
                user: document.getElementById('set-user').value.trim() || 'admin',
                pass: document.getElementById('set-pass').value || '123',
                phone: document.getElementById('set-phone').value.trim(),
                defaultPrice: parseFloat(document.getElementById('set-price').value) || 0,
                tgToken: document.getElementById('set-tg-token').value.trim(),
                chatId: document.getElementById('set-chat-id').value.trim()
            };
            window.saveConfigToCloud(); toast("Saqlandi ✅"); closeSettings();
        }

        /* ---------- TUN / YORUG'LIK ---------- */
        function toggleDark() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('dark', document.body.classList.contains('dark-mode') ? '1' : '0');
            document.getElementById('dark-toggle').innerText =
                document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
            renderTable();
        }

        /* ---------- EKSPORT ---------- */
        function exportExcel() {
            const m = document.getElementById('month-select').value;
            const data = (window.archiveData[m] || []).map((s, i) => ({
                'No': i + 1, 'Ism Sharif': s.name, 'Narx': +s.price, 'Ovqat': +s.food,
                'Sof': (+s.price||0) - (+s.food||0), 'Holat': getStatusLabel(s.st),
                'Davomat': s.att ? 'Keldi' : 'Kelmadi'
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, m);
            XLSX.writeFile(wb, `Hisobot_${m}.xlsx`);
            toast("Excel yuklab olindi 📊");
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const m = document.getElementById('month-select').value;
            const data = window.archiveData[m] || [];
            let tP = 0, tF = 0;
            data.forEach(s => { tP += +s.price || 0; tF += +s.food || 0; });

            doc.setFontSize(16);
            doc.text("Maktab Buxgalteriya — " + m + " oyi", 14, 15);
            doc.setFontSize(10);
            doc.text("Tushum: " + tP.toLocaleString() + " | Chiqim: " + tF.toLocaleString() +
                     " | Foyda: " + (tP - tF).toLocaleString(), 14, 22);

            doc.autoTable({
                startY: 28,
                head: [['No', 'Ism Sharif', 'Narx', 'Ovqat', 'Sof', 'Holat', 'Davomat']],
                body: data.map((s, i) => [i + 1, s.name, (+s.price||0).toLocaleString(),
                    (+s.food||0).toLocaleString(), ((+s.price||0)-(+s.food||0)).toLocaleString(),
                    getStatusLabel(s.st), s.att ? 'Keldi' : 'Kelmadi']),
                foot: [['', 'JAMI', tP.toLocaleString(), tF.toLocaleString(),
                        (tP - tF).toLocaleString(), '', '']],
                styles: { fontSize: 9 },
                headStyles: { fillColor: [99, 102, 241] }
            });
            doc.save(`Hisobot_${m}.pdf`);
            toast("PDF yuklab olindi 📄");
        }

        /* ---------- ZAXIRA ---------- */
        function backupJSON() {
            const blob = new Blob([JSON.stringify(window.archiveData, null, 2)], { type:'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'zaxira_' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            toast("Zaxira fayli yuklandi 💾");
        }

        function restoreJSON(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    if (!confirm("Zaxira hozirgi ma'lumotlarni almashtiradi. Davom etilsinmi?")) return;
                    window.archiveData = JSON.parse(e.target.result);
                    window.saveToCloud(); renderTable();
                    toast("Zaxira tiklandi ✅");
                } catch { toast("Fayl noto'g'ri formatda!", 'err'); }
            };
            reader.readAsText(file);
            input.value = '';
        }

        /* ---------- TELEGRAM ---------- */
        function sendTelegram() {
            const c = window.config;
            if (!c.tgToken || !c.chatId) return toast("Sozlamalarda Bot Token va Chat ID kiriting!", 'err');
            const m = document.getElementById('month-select').value;
            const data = window.archiveData[m] || [];
            if (!data.length) return toast("Ma'lumot yo'q!", 'err');

            let tP = 0;
            let text = `📊 <b>${m} oyi hisoboti</b>\n\n`;
            data.forEach((s, i) => {
                tP += +s.price || 0;
                const st = s.st === 'st-paid' ? '✅' : s.st === 'st-partial' ? '🟡' : '🔴';
                text += `${i + 1}. <b>${esc(s.name)}</b> — ${(+s.price||0).toLocaleString()} so'm ${st}\n`;
            });
            text += `\n💰 Jami tushum: <b>${tP.toLocaleString()} so'm</b>`;
            text += `\n📅 Sana: ${new Date().toLocaleDateString('uz-UZ')}`;

            fetch(`https://api.telegram.org/bot${c.tgToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: c.chatId, text: text, parse_mode: 'HTML' })
            })
            .then(r => r.json())
            .then(res => res.ok ? toast("Telegramga yuborildi! 🤖")
                                : toast("Xatolik: " + (res.description || ''), 'err'))
            .catch(() => toast("Internet xatosi!", 'err'));
        }

        /* ---------- BOSHLANG'ICH SOZLASH ---------- */
        if (localStorage.getItem('dark') === '1') {
            document.body.classList.add('dark-mode');
            document.getElementById('dark-toggle').innerText = '☀️';
        }
        document.getElementById('month-select').value = MONTHS[new Date().getMonth()];
        ['username', 'password'].forEach(id =>
            document.getElementById(id).addEventListener('keydown', e => {
                if (e.key === 'Enter') handleLogin();
            }));
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });
        setInterval(updateSyncIndicator, 2000);
    </script>
</body>
</html>
