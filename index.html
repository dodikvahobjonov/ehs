<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Bernulli yechim</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    text-align: center;
}

.box {
    background: white;
    padding: 30px;
    margin: 50px auto;
    width: 450px;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
}

h2 {
    color: #333;
}

input {
    padding: 10px;
    margin: 10px 0;
    width: 90%;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

input:focus {
    border-color: #28a745;
    outline: none;
}

button {
    padding: 12px 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.3s;
}

button:hover {
    background: #218838;
}

.step {
    text-align: left;
    margin-top: 15px;
    background: #f9f9f9;
    padding: 12px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 15px;
}

.result-title {
    font-weight: bold;
    margin-top: 20px;
    color: #007bff;
}
</style>
</head>

<body>

<div class="box">
    <h2>Bernulli formulasi</h2>

    <input type="number" id="n" placeholder="n (tajriba soni)">
    <input type="number" id="k" placeholder="k (muvaffaqiyat soni)">
    <input type="number" step="0.01" id="p" placeholder="p (0.1 kabi)">

    <br>
    <button onclick="hisobla()">Hisoblash</button>

    <div id="steps"></div>
</div>

<script>
function factorial(n) {
    if(n === 0) return 1;
    let res = 1;
    for (let i = 1; i <= n; i++) res *= i;
    return res;
}

function combination(n, k) {
    return factorial(n) / (factorial(k) * factorial(n - k));
}

function hisobla() {
    let n = Number(document.getElementById("n").value);
    let k = Number(document.getElementById("k").value);
    let p = Number(document.getElementById("p").value);

    if(isNaN(n) || isNaN(k) || isNaN(p) || n<0 || k<0 || p<0 || p>1 || k>n) {
        alert("Iltimos, to‘g‘ri qiymat kiriting!");
        return;
    }

    let q = 1 - p;
    let C = combination(n, k);
    let pk = Math.pow(p, k);
    let qn = Math.pow(q, n - k);
    let result = C * pk * qn;

    let stepsDiv = document.getElementById("steps");
    stepsDiv.innerHTML = "";

    // Qadamlarni ko'rsatish jonli
    let steps = [
        `Formulasi: P<sub>${n}</sub>(${k}) = C<sub>${n}</sub><sup>${k}</sup> · (${p})<sup>${k}</sup> · (${q.toFixed(2)})<sup>${n-k}</sup>`,
        `Kombinatsiya: C<sub>${n}</sub><sup>${k}</sup> = ${C}`,
        `p<sup>k</sup> · q<sup>n-k</sup> = ${pk.toFixed(4)} · ${qn.toFixed(4)}`,
        `<span class="result-title">Natija: ${result.toFixed(4)}</span>`
    ];

    steps.forEach((step, index) => {
        setTimeout(() => {
            stepsDiv.innerHTML += `<div class="step">${step}</div>`;
        }, index * 500);
    });
}
</script>

</body>
</html>
